# Single source of truth for the kart's electrical connections (netlist model).
#
# Model:
#   devices:  each device declares ALL its pins.
#   nets:     each net lists the pins tied together (one electrical node).
#   Pin references are  <device>.<pin>.
#
# The whole-kart wire table on the Wiring page is GENERATED from this file
# (generate_wiring_hook.py) — edit here, not the table.
#
# Completeness is enforced by  scripts/check_wiring.py :
#   - every pin named in a net must be a declared device pin        (else ERROR: phantom pin)
#   - every net must connect >= 2 pins, unless  single: true         (else ERROR: dangling net)
#   - every declared pin must appear on some net or in no_connect    (else GAP: unwired pin)
#
# Wire colour is DERIVED from class + voltage via color_code, unless the net sets `color:`.
# Scope: ELECTRICAL only. Pneumatic (air) lines live in the Pneumatic Braking docs.
# Only the kart-medulla PCB is authoritative in KiCad (dv-hardware); the rest is
# transcribed from the wiring diagram/docs and should be field-verified.

color_code:            # house code, applied to power rails we run ourselves
  "48V": "—"           # pack cabling: no assigned colour
  "24V": "—"           # sensor rail (planned): no house colour
  "12V": red
  "5V": orange
  "3.3V": yellow
  "0V": black          # power GND; signal GND is black/white and set per-net
  # white/gray is deliberately unassigned: it carries no promise about the wire, so it is
  # the safe default for anything without an obvious colour. Every other colour here IS a
  # promise, and a wrong one misleads whoever reads it next.
  signal: white/gray   # all signal wires unless a bus convention applies

devices:
  battery:        {desc: "13S LiPo pack (~48 V)", pins: [pos, neg]}
  buck_48_12:     {desc: "48→12 V buck (Weishuo Y3-T4812)", pins: [in+, in-, out+, out-]}
  orin:           {desc: "Jetson AGX Orin dev kit", pins: [pwr12, usb_esp32, usb_zed]}
  zed2:           {desc: "ZED2 stereo camera", pins: [usb]}
  medulla:
    desc: "kart-medulla ESP32-S3 interface PCB"
    authority: "dv-hardware/projects/kart-medulla (KiCad)"
    pins: [CN1.1, CN1.2, CN1.3, CN2.1, CN2.2, CN2.3, CN3.1, CN3.2, CN3.3,
           CN4.1, CN4.2, CN4.3, CN5.1, CN5.2, CN5.3, CN6.1, CN6.2, CN6.3,
           CN7.1, CN7.2, CN7.3, CN8.1, CN8.2, CN8.3, CN9.1, CN9.2, CN9.3,
           CN10.1, CN10.2, CN10.3, USB]
  cytron:         {desc: "Cytron MD25HV steering H-bridge (7-58 V input)", pins: [vin, gnd, pwm, dir, mplus, mminus]}
  steer_motor:    {desc: "Steering motor — salvaged 24 V geared DC, deliberately run off the 48 V pack (intermittent duty, well cooled, PWM capped at 50%). See steering/index.md.", pins: [mplus, mminus]}
  steer_sensor:   {desc: "Steering angle sensor (AS5600 now / MT6701 planned)", pins: [vcc, gnd, sda, scl, pwm]}
  esc:            {desc: "BLDC traction ESC (AliExpress 48 V)", pins: [v+, v-, u, v, w, throttle, key1, key2]}
  motor:          {desc: "3-phase BLDC traction motor + Hall block", pins: [u, v, w, hall1, hall2, hall3, hall5v, hallgnd]}
  acc_pedal:      {desc: "Accelerator pedal (linear Hall)", pins: [sig, vcc, gnd]}
  brake_pedal:    {desc: "Brake pedal (linear Hall)", pins: [sig, vcc, gnd]}
  mode_switch:
    desc: "Manual/Auto mode switch on the kart panel — DPDT, both poles in use"
    note: "Pole 1 selects the throttle source reaching the ESC (manual pedal / autonomous command).
      Pole 2 breaks the Cytron-to-steering-motor cable, so the steering motor is physically
      disconnected in manual mode. The Cytron's own 48 V supply is NOT switched — it stays
      permanently powered, a deliberate choice because gating it caused inrush brownouts on the
      Orin at every mode change. Metal contacts, so both poles hold their manual position with
      the whole kart unpowered and no firmware can override them."
    pins: [common, manual, auto, steer_in, steer_out]
  opamp:          {desc: "×2 op-amp (brake 0–5 → 0–10 V)", pins: [in, out]}
  vppm:           {desc: "Festo VPPM proportional brake valve", pins: [setpoint, v24, gnd]}
  ebs_coil:       {desc: "Festo EBS solenoid coil (VUVS, form C)", pins: [a, b]}
  compressor_fet: {desc: "EBS air-compressor MOSFET (low side)", pins: [gate, drain, source]}
  compressor:     {desc: "Air-compressor motor (~7.4 V)", pins: [pos, neg]}
  press1:         {desc: "Festo SDE5 pressure sensor 1 — tank side", vendor: festo, pins: [supply, gnd, out]}
  press2:         {desc: "Festo SDE5 pressure sensor 2 — piston (regulated side)", vendor: festo, pins: [supply, gnd, out]}
  hyd1:           {desc: "Hydraulic pressure sensor 1 (planned — not yet installed)", pins: [sig, supply, gnd]}
  hyd2:           {desc: "Hydraulic pressure sensor 2 (planned — not yet installed)", pins: [sig, supply, gnd]}
  kill1:          {desc: "Kill switch 1", pins: [a, b]}
  kill2:          {desc: "Kill switch 2", pins: [a, b]}
  kill3:          {desc: "Kill switch 3", pins: [a, b]}
  impact:         {desc: "Impact / crash switch", pins: [a, b]}
  res:            {desc: "Remote E-stop relay (contacts in chain)", pins: [a, b]}
  sdc_relay:      {desc: "SDC relay", pins: [coil+, coil-, no1, no2, no3]}
  ebox_reverse:   {desc: "Kart electronics-box reverse input", pins: [rev]}
  wago_gnd:
    desc: "Rear ground Wago block — the ground star point, near the battery and the 12 V / 24 V regulators"
    note: "One block = one electrical node. The `pwr` and `sig` pins are the two returns
           meeting here; this block IS the single tie between them. Do not bond GND and
           GND_SIG anywhere else."
    pins: [pwr, sig]

nets:
  # --- power distribution ---
  - {name: PACK48, system: Power, class: power, voltage: "48V", pins: [battery.pos, buck_48_12.in+, esc.v+, cytron.vin], note: "High-current traction feed. The Cytron sits here permanently, not on the 12 V rail and not switched by the mode switch."}
  - {name: "12V",  system: Power, class: power, voltage: "12V", pins: [buck_48_12.out+, medulla.CN1.2, orin.pwr12, kill1.a, compressor.pos]}
  - {name: "5V",   system: Power, class: power, voltage: "5V",  pins: [medulla.CN2.3, motor.hall5v, acc_pedal.vcc, brake_pedal.vcc], note: "Rail from Orin USB VBUS / XW-1224 buck (split-rail)"}
  - {name: "3V3",  system: Power, class: power, voltage: "3.3V", pins: [medulla.CN1.1, medulla.CN6.3, steer_sensor.vcc]}
  - {name: "24V",  system: Power, class: power, voltage: "24V", status: planned, pins: [press1.supply, press2.supply, vppm.v24], note: "Shared sensor/VPPM rail, buck-boost not yet fitted"}
  - {name: GND,     system: Power, class: power, voltage: "0V", pins: [wago_gnd.pwr, battery.neg, buck_48_12.in-, buck_48_12.out-, esc.v-, medulla.CN1.3, medulla.CN9.3, medulla.CN10.3, cytron.gnd, vppm.gnd, compressor_fet.source, ebs_coil.b, sdc_relay.coil-], note: "Power return: motors, valves, coils, rails. Ties to GND_SIG only at wago_gnd."}
  - {name: GND_SIG, system: Power, class: power, voltage: "0V", color: black/white, pins: [wago_gnd.sig, steer_sensor.gnd, acc_pedal.gnd, brake_pedal.gnd, press1.gnd, press2.gnd, hyd1.gnd, hyd2.gnd, motor.hallgnd], note: "Sensor/analog return. Black + white stripe. Single tie to GND at the rear wago_gnd block."}

  # --- compute / perception ---
  - {name: USB_ESP32, system: Compute, class: signal, voltage: "5V", color: orange, pins: [orin.usb_esp32, medulla.USB], note: "Orin↔ESP32 command/telemetry (USB serial, no CAN)"}
  - {name: USB_ZED,   system: Compute, class: signal, voltage: "5V", color: orange, pins: [orin.usb_zed, zed2.usb], note: "USB 3.0"}

  # --- traction ---
  - {name: MOTOR_U, system: Traction, class: drive, voltage: "48V", color: "—", pins: [esc.u, motor.u]}
  - {name: MOTOR_V, system: Traction, class: drive, voltage: "48V", color: "—", pins: [esc.v, motor.v]}
  - {name: MOTOR_W, system: Traction, class: drive, voltage: "48V", color: "—", pins: [esc.w, motor.w]}

  # --- steering ---
  - {name: I2C_SDA,         system: Steering, class: signal, voltage: "3.3V", pins: [medulla.CN4.2, steer_sensor.sda]}
  - {name: I2C_SCL,         system: Steering, class: signal, voltage: "3.3V", pins: [medulla.CN4.1, steer_sensor.scl]}
  - {name: STEER_ANGLE_PWM, system: Steering, class: signal, voltage: "3.3V", status: planned, pins: [medulla.CN5.2, steer_sensor.pwm], note: "Future MT6701 single-wire PWM (R10 removed)"}
  - {name: CMD_STEER_PWM,   system: Steering, class: signal, voltage: "3.3V", pins: [medulla.CN9.1, cytron.pwm]}
  - {name: CMD_STEER_DIR,   system: Steering, class: signal, voltage: "3.3V", pins: [medulla.CN8.3, cytron.dir]}
  - {name: "STEER_M+_SW",   system: Steering, class: drive, voltage: "48V", color: "—", pins: [cytron.mplus, mode_switch.steer_in], note: "Cytron output up to the mode switch's second pole. M+ is the switched conductor — confirmed by Rubén 2026-08-08; M- runs straight through."}
  - {name: "STEER_M+",      system: Steering, class: drive, voltage: "48V", color: "—", pins: [mode_switch.steer_out, steer_motor.mplus], note: "Open in manual mode — the switch's second pole physically disconnects the steering motor, so a firmware fault cannot steer the kart while a human is driving it."}
  - {name: "STEER_M-",      system: Steering, class: drive, voltage: "48V", color: "—", pins: [cytron.mminus, steer_motor.mminus]}

  # --- throttle ---
  - {name: PEDAL_ACC,   system: Throttle, class: signal, voltage: "0–5V", pins: [acc_pedal.sig, medulla.CN6.2, mode_switch.manual], note: "One net, two consumers: the medulla reads it on an ADC, and it goes to the mode switch's manual contact. In manual mode the pedal reaches the ESC through metal contacts only — the medulla is not in that path and does not need to be powered."}
  - {name: CMD_ACC_DAC, system: Throttle, class: signal, voltage: "0–5V", pins: [medulla.CN10.1, mode_switch.auto]}
  - {name: CMD_ACC_ESC, system: Throttle, class: signal, voltage: "0–5V", pins: [mode_switch.common, esc.throttle], note: "Gated throttle to the ESC"}

  # --- brake ---
  - {name: PEDAL_BRAKE,        system: Brake, class: signal, voltage: "0–5V", pins: [brake_pedal.sig, medulla.CN6.1]}
  - {name: CMD_BRAKE_5V,       system: Brake, class: signal, voltage: "0–5V", pins: [medulla.CN10.2, opamp.in]}
  - {name: CMD_BRAKE_10V,      system: Brake, class: signal, voltage: "0–10V", pins: [opamp.out, vppm.setpoint], note: "Proportional brake setpoint"}
  - {name: CMD_COMPRESSOR_PWM, system: Brake, class: signal, voltage: "3.3V", pins: [medulla.CN8.2, compressor_fet.gate], note: "Ex-BUZZ terminal"}
  - {name: COMPRESSOR_MOTOR,   system: Brake, class: drive, voltage: "12V", color: "—", status: in-design, pins: [compressor.neg, compressor_fet.drain], note: "12 V→~7.4 V via low-side PWM; FET/flyback sizing TBD"}
  - {name: EBS_COIL,           system: Brake, class: power, voltage: "12V", pins: [sdc_relay.no3, ebs_coil.a], note: "12 V gated by the SDC relay; Festo form-C connector"}

  # --- sensors ---
  - {name: PRESSURE_1,  system: Sensors, class: signal, voltage: "0–10V", color: black, pins: [press1.out, medulla.CN7.1], note: "**Tank** sensor. Festo EN 60947-5-2: black = signal"}
  - {name: PRESSURE_2,  system: Sensors, class: signal, voltage: "0–10V", color: black, pins: [press2.out, medulla.CN7.2], note: "**Piston** (regulated-side) sensor. Festo EN 60947-5-2: black = signal"}
  - {name: HYDRAULIC_1, system: Sensors, class: signal, voltage: "3.3V", status: planned, pins: [hyd1.sig, medulla.CN9.2], note: "Terminal reserved; hydraulic sensor not installed yet"}
  - {name: HYDRAULIC_2, system: Sensors, class: signal, voltage: "3.3V", status: planned, pins: [hyd2.sig, medulla.CN5.1], note: "Terminal reserved; hydraulic sensor not installed yet"}
  - {name: MOTOR_HALL_1, system: Sensors, class: signal, voltage: "5V", pins: [motor.hall1, medulla.CN7.3], note: "Level-shifted to 3.3 V on PCB"}
  - {name: MOTOR_HALL_2, system: Sensors, class: signal, voltage: "5V", pins: [motor.hall2, medulla.CN2.2], note: "Level-shifted on PCB"}
  - {name: MOTOR_HALL_3, system: Sensors, class: signal, voltage: "5V", pins: [motor.hall3, medulla.CN2.1], note: "Level-shifted on PCB"}

  # --- shutdown circuit (series chain; opening any switch drops the relay coil) ---
  - {name: SDC_1, system: Shutdown, class: signal, voltage: "12V", pins: [kill1.b, impact.a]}
  - {name: SDC_2, system: Shutdown, class: signal, voltage: "12V", pins: [impact.b, res.a]}
  - {name: SDC_3, system: Shutdown, class: signal, voltage: "12V", pins: [res.b, kill2.a]}
  - {name: SDC_4, system: Shutdown, class: signal, voltage: "12V", pins: [kill2.b, kill3.a]}
  - {name: SDC_5, system: Shutdown, class: signal, voltage: "12V", pins: [kill3.b, sdc_relay.coil+, medulla.CN8.1], note: "Coil node; medulla pulls it low via Q3 (S3 board), low-side of the relay coil — Q3 is N-channel so its reference must be ground. Confirmed by Rubén 2026-07-19. Its source belongs on PWR_GND in medulla-v2."}
  - {name: ESC_KEY_1, system: Shutdown, class: signal, pins: [sdc_relay.no1, esc.key1], note: "Relay NO closes the ESC 2-wire key loop"}
  - {name: ESC_KEY_2, system: Shutdown, class: signal, pins: [sdc_relay.no2, esc.key2]}

  # --- misc ---
  - {name: REVERSE, system: Misc, class: signal, voltage: "5V", pins: [medulla.CN4.3, ebox_reverse.rev], note: "Pull to 0 V to engage reverse (via Q4, BSS123)"}

# Pins intentionally left unconnected right now.
#  - spare PCF8574 expander terminals
#  - hydraulic-sensor supplies: sensors not installed yet, so these are free for now;
#    they join the sensor rail when the hydraulic sensors are fitted.
no_connect: [medulla.CN3.1, medulla.CN3.2, medulla.CN3.3, medulla.CN5.3,
             hyd1.supply, hyd2.supply]
